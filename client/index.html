<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FF0033" />
    <meta name="description" content="VidTube - upload, share and discover videos. A modern video platform built with React, Express and MongoDB." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <title>VidTube</title>
    <script>
      // Resolve the theme before the first paint so the page never flashes
      // the wrong colours on load. Mirrors src/context/ThemeContext.jsx.
      (function () {
        try {
          var stored = localStorage.getItem('vidtube:theme');
          var preference = ['light', 'dark', 'system'].indexOf(stored) !== -1 ? stored : 'system';
          var resolved = preference === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : preference;
          document.documentElement.setAttribute('data-theme', resolved);
          document.documentElement.classList.toggle('dark', resolved === 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body class="bg-dark-base text-gray-100 antialiased selection:bg-brand selection:text-white min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
